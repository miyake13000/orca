[workspace]
resolver = "3"
members = ["orca-hash", "orca-vcs", "orca-image", "orca-container", "orca"]

[workspace.package]
version = "1.0.0-pre"
edition = "2024"
license = "MIT"

[workspace.dependencies]
orca-hash = { path = "orca-hash" }
orca-vcs = { path = "orca-vcs" }
orca-image = { path = "orca-image" }
orca-container = { path = "orca-container" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
walkdir = "2"
libc = "0.2"
nix = { version = "0.29", features = [
    "fs",
    "mount",
    "sched",
    "signal",
    "process",
    "term",
    "poll",
    "socket",
    "hostname",
    "uio",
    "user",
    "time",
    "ioctl",
] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] , default-features = false }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
xattr = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
